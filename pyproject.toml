[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project]
name = "rosa-torch"
version = "0.3.0"
description = "Independent PyTorch implementation of RWKV-8 ROSA with exact suffix-automaton retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
maintainers = [
    { name = "Lucas", email = "30107107+aabbdev@users.noreply.github.com" },
]
dependencies = ["torch"]

[project.optional-dependencies]
numba = ["numba>=0.66"]

[project.urls]
Repository = "https://github.com/aabbdev/rosa"
Issues = "https://github.com/aabbdev/rosa/issues"
Changelog = "https://github.com/aabbdev/rosa/blob/v0.3.0/CHANGELOG.md"
"Original ROSA description" = "https://www.rwkv.com/#rwkv-8-explained"

[dependency-groups]
dev = [
    "coverage>=7.10",
    "pyright[nodejs]>=1.1.400",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src/rosa"]
pythonVersion = "3.10"

[tool.uv.build-backend]
module-name = "rosa"
source-include = ["CHANGELOG.md"]
